name: Capture Harbor example

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/harbor-example.yml
      - agent_eval/harbor_import.py
      - examples/harbor-v1/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/examples/harbor-v1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Harbor runner
        run: python -m pip install harbor==0.23.0
      - name: Capture baseline
        run: harbor trials start --path examples/harbor-v1/hello-file --agent nop --trial-name baseline --trials-dir artifacts/harbor-trials
      - name: Check baseline rewards
        run: >-
          python -c "import json, pathlib;
          trial = json.loads(pathlib.Path('artifacts/harbor-trials/baseline/result.json').read_text());
          assert trial['verifier_result']['rewards'] == {'created_hello_file': 0, 'existing_file_preserved': 1}"
      - name: Capture successful trial
        run: >-
          harbor trials start --path examples/harbor-v1/hello-file --agent scripted_hello:ScriptedHelloAgent
          --trial-name scripted --trials-dir artifacts/harbor-trials
      - name: Import and replay trial
        run: |
          python -m agent_eval import-harbor --trial artifacts/harbor-trials/scripted --dataset examples/harbor-v1/dataset --case-id hello-file --output artifacts/harbor-suite.json
          python -m agent_eval --suite artifacts/harbor-suite.json --report artifacts/harbor-report.json
      - name: Stage a promotion proposal
        run: |
          run_id=$(python -c "import json; print(json.load(open('artifacts/harbor-report.json'))['cases'][0]['run_id'])")
          python -m agent_eval promote --dataset examples/harbor-v1/dataset --report artifacts/harbor-report.json --run-id "$run_id" --reason 'Verified named Harbor rewards' --output artifacts/harbor-proposal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-trial-and-replay
          path: artifacts/harbor-*
