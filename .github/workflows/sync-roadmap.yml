name: Sync roadmap issues

on:
  push:
    branches: [main]
    paths:
      - .github/roadmap.json
      - .github/workflows/sync-roadmap.yml
      - scripts/sync_roadmap.py
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-roadmap-issues
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Create missing roadmap issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_roadmap.py --repository "$GITHUB_REPOSITORY"
